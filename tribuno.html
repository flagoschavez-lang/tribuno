denses",time:"Hace 32 min",readTime:"3 min",assetId:"SPX",body:["La política monetaria sigue siendo uno de los principales focos de atención para los mercados. Las expectativas sobre los tipos de interés influyen en las valoraciones de las empresas y en la distribución del capital entre sectores.","El S&P 500 ofrece una visión amplia del mercado estadounidense. Junto al Nasdaq 100 y al Dow Jones, permite comparar el comportamiento de las grandes tecnológicas con el de la economía más tradicional.","Para seguir la próxima sesión, los inversores prestan especial atención a los datos de inflación, empleo y actividad económica. Ningún indicador aislado cuenta toda la historia: el contexto y el horizonte temporal son fundamentales."]},{id:2,category:"Cripto",title:"Bitcoin recupera terreno y vuelve a despertar el interés del mercado",summary:"El activo digital lidera una nueva jornada de movimientos en el ecosistema cripto.",image:"https://images.pexels.com/photos/38697057/pexels-photo-38697057.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=627&w=1200",alt:"Una moneda dorada de Bitcoin sobre un fondo oscuro",time:"Hace 1 h",readTime:"4 min",assetId:"BTCUSD",body:["Bitcoin concentra una parte importante de la capitalización del mercado de criptomonedas. Sus movimientos suelen marcar el tono para otros activos digitales, aunque cada proyecto tiene sus propias dinámicas.","El volumen de negociación, la liquidez y los flujos hacia productos cotizados son algunas de las variables que observan los participantes. La volatilidad puede ser elevada incluso en periodos de aparente estabilidad.","El mercado cripto opera las 24 horas, los siete días de la semana. Definir un horizonte de inversión y conocer los riesgos resulta especialmente importante en este entorno."]},{id:3,category:"Tecnología",title:"La inteligencia artificial mantiene a los chips en el centro de todas las miradas",summary:"La inversión en centros de datos transforma las perspectivas del sector de semiconductores.",im
