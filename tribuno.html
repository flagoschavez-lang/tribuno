 ciclos de inversión son factores clave a la hora de valorar sus perspectivas.","Además del crecimiento de los ingresos, los analistas observan los márgenes, la capacidad de producción y la concentración de clientes. La innovación abre oportunidades, pero no elimina los riesgos empresariales."]},{id:4,category:"Divisas",title:"El dólar cede terreno mientras el euro recupera la senda alcista",summary:"Los pares de divisas ajustan posiciones tras una semana de movimientos impulsados por los datos macro.",image:"https://images.pexels.com/photos/164527/pexels-photo-164527.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=627&w=1200",alt:"Fajos de billetes y monedas sobre una mesa",time:"Hace 3 h",readTime:"4 min",assetId:"EURUSD",body:["El mercado de divisas se mueve al ritmo de los diferenciales de tipos y de los datos económicos de cada región. El euro/dólar sigue siendo el par más negociado del mundo.","Las expectativas sobre la política monetaria del BCE y de la Reserva Federal determinan, en gran medida, hacia dónde se dirigen las monedas de referencia.","En un entorno de divisas, el análisis de la volatilidad implícita y de los flujos institucionales ayuda a contextualizar los movimientos del día a día."]},{id:5,category:"Materias primas",title:"El oro marca nuevos máximos y reaviva el interés por los metales preciosos",summary:"La demanda de refugio seguro impulsa al metal amarillo y contagia a la plata.",image:"https://images.pexels.com/photos/280240/pexels-photo-280240.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=627&w=1200",alt:"Lingotes de oro apilados",time:"Hace 4 h",readTime:"3 min",assetId:"GC1!",body:["El oro ha vuelto a centrar la atención de los inversores como refugio ante la incertidumbre política y las tensiones geopolíticas.","La plata suele amplificar los movimientos del oro, aunque su demanda industrial la vincula también al ciclo económico y a la energía renovable.","Las posiciones de los fondos y los flujos hacia ETF respaldados físicamente son algunas de inta a uno aislado.",textEn:"Before following a trend, I compare market breadth with volume. A move backed by more sectors tells a very different story than an isolated one.",color:"#e9e0fc"},{name:"Daniel Rojas",handle:"dani.crypto",asset:"BTCUSD",tag:"crypto",category:c("community.crypto"),title:"Bitcoin y el valor de tener un plan",titleEn:"Bitcoin and the value of a plan",text:"Los movimientos de corto plazo no deberían cambiar un horizonte de largo plazo. Estos son los niveles que estoy observando en mi escenario de base, con el riesgo siempre definido.",textEn:"Short-term moves should not change a long-term horizon. These are the levels I am watching in my base scenario, with risk always defined.",color:"#e2ede2"},{name:"Laura Sánchez",handle:"laura.invest",asset:"NVDA",tag:"stocks",category:c("community.stocks"),title:"Semiconductores: más allá del titular",titleEn:"Semiconductors: beyond the headline",text:"Los resultados y las expectativas no siempre avanzan al mismo ritmo. Mirar los márgenes junto a los ingresos ayuda a poner las valoraciones en perspectiva.",textEn:"Results and expectations do not always move at the same pace. Looking at margins alongside revenue helps put valuations in perspective.",color:"#f4e6d7"},{name:"Marcos Peña",handle:"mpena.forex",asset:"EURUSD",tag:"forex",category:c("community.forex"),title:"EUR/USD y el diferencial de tipos",titleEn:"EUR/USD and the rate differential",text:"Cuando el mercado cambia de expectativas sobre los bancos centrales, el cruce lo nota rápido. Sigo el diferencial de tipos antes que el ruido intradía.",textEn:"When the market changes expectations about central banks, the pair notices quickly. I follow the rate differential rather than intraday noise.",color:"#e0ecf7"},{name:"Sofía Iglesias",handle:"sofia.macro",asset:"US10Y",tag:"fixed",category:c("community.indices"),title:"La renta fija vuelve al centro del debate",titleEn:"Fixed income is back at the center of the debate",text:"El bono a diez años es
